<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de empleados</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">P</div>
          <div>
            <p class="eyebrow">Administración</p>
            <h1>Prepaga - Nómina</h1>
          </div>
        </div>
        <div class="status-pill">Sistema activo</div>
      </header>

      <section id="stats" class="stats-grid" aria-live="polite"></section>

      <section class="panel">
        <div class="section-heading">
          <h2 id="form-title">Alta de afiliado</h2>
          <span class="section-tag">Campos obligatorios</span>
        </div>
        <form id="empleado-form" novalidate>
          <div class="form-section">
            <h3>Datos personales</h3>
            <div class="field-grid">
              <label>
                Nombre
                <input type="text" name="nombre" placeholder="Ej: Ana" required />
              </label>
              <label>
                Apellido
                <input type="text" name="apellido" placeholder="Ej: Gómez" required />
              </label>
              <label class="full-width">
                Email
                <input type="email" name="email" placeholder="Ej: ana@test.com" required />
              </label>
            </div>
          </div>

          <div class="form-section">
            <h3>Datos administrativos</h3>
            <div class="field-grid">
              <label>
                Puesto
                <select name="puesto" required>
                  <option value="">Seleccioná un puesto</option>
                  <option value="QA">QA</option>
                  <option value="Desarrollador">Desarrollador</option>
                  <option value="Analista">Analista</option>
                  <option value="Gerente">Gerente</option>
                  <option value="Soporte">Soporte</option>
                  <option value="Diseñador">Diseñador</option>
                </select>
              </label>
              <label>
                Tipo de documento
                <select name="tipo_documento" required>
                  <option value="">Seleccioná un documento</option>
                  <option value="Cédula">Cédula</option>
                  <option value="Libreta cívica">Libreta cívica</option>
                  <option value="Libreta de enrolamiento">Libreta de enrolamiento</option>
                  <option value="DNI">DNI</option>
                  <option value="Pasaporte">Pasaporte</option>
                  <option value="Otro">Otro</option>
                </select>
              </label>
            </div>
          </div>

          <div class="actions-row">
            <button type="submit" id="submit-button" class="primary-btn">Guardar afiliado</button>
            <button type="button" id="cancel-edit" class="secondary hidden">Cancelar edición</button>
          </div>
        </form>
        <p id="mensaje" class="mensaje" aria-live="polite"></p>
      </section>

      <section class="panel">
        <div class="table-header">
          <h2>Listado de afiliados</h2>
          <button type="button" id="delete-all" class="danger-btn">Borrar todo</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Email</th>
                <th>Puesto</th>
                <th>Tipo de documento</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="empleados-body">
              <tr>
                <td colspan="7" class="empty">Cargando empleados...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
