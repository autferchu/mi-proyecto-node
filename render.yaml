services:
  - type: web
    name: mi-api-empleados
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: mi-api-empleados-db
          property: connectionString

databases:
  - name: mi-api-empleados-db
    databaseName: mi_api_empleados
    user: mi_api_empleados
    plan: free
