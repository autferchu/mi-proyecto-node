name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Instalar dependencias
      run: npm ci

    - name: Instalar navegadores de Playwright con dependencias del sistema
      run: npx playwright install --with-deps

    - name: Correr tests de Playwright
      run: npx playwright test
      env:
        # Forzar a Node a usar la IP 127.0.0.1 para evitar conflictos DNS/IPv6 en GitHub Actions
        HOST: 127.0.0.1

    - name: Subir reporte de Playwright (si falla)
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30